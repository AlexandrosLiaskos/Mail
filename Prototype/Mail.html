<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Liaskos Mail — design canvas</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&family=Italianno&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  *, *::before, *::after { box-sizing: border-box; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="canvas/data.jsx"></script>
<script type="text/babel" src="canvas/chrome.jsx"></script>
<script type="text/babel" src="canvas/screen-prelogin.jsx"></script>
<script type="text/babel" src="canvas/screen-inbox.jsx"></script>
<script type="text/babel" src="canvas/screen-reader.jsx"></script>
<script type="text/babel" src="canvas/screen-extras.jsx"></script>

<script type="text/babel" data-presets="react">
const W = 1440;
const H = 900;

function App() {
  return (
    <DesignCanvas>
      <DCSection id="prelogin" title="Pre-login" subtitle="Frontispiece · Sign-in · First-run credentials vault">
        <DCArtboard id="frontispiece" label="Frontispiece" width={W} height={H}>
          <ScreenFrontispiece />
        </DCArtboard>
        <DCArtboard id="login" label="Sign in" width={W} height={H}>
          <ScreenLogin />
        </DCArtboard>
        <DCArtboard id="credentials" label="Set credentials · first run" width={W} height={H}>
          <ScreenCredentials />
        </DCArtboard>
      </DCSection>

      <DCSection id="inbox" title="Inbox" subtitle="Two-column shell · folders + list · reader opens as modal · three density variants">
        <DCArtboard id="inbox-spacious" label="A · Spacious — three lines per row" width={W} height={H}>
          <ScreenInbox density="spacious" />
        </DCArtboard>
        <DCArtboard id="inbox-medium" label="B · Medium — two lines" width={W} height={H}>
          <ScreenInbox density="medium" />
        </DCArtboard>
        <DCArtboard id="inbox-dense" label="C · Dense — printed index" width={W} height={H}>
          <ScreenInbox density="dense" />
        </DCArtboard>
      </DCSection>

      <DCSection id="reader" title="Reader · modal" subtitle="A single letter, opened in place. Tracked metadata, serif body, calligraphic signed-line.">
        <DCArtboard id="reader" label="Open letter" width={W} height={H}>
          <ScreenReader />
        </DCArtboard>
      </DCSection>

      <DCSection id="compose" title="Compose · modal" subtitle="Bottom-right drawer modal · reply to a thread · single calligraphic flourish in the signature">
        <DCArtboard id="compose" label="Compose reply" width={W} height={H}>
          <ScreenCompose />
        </DCArtboard>
      </DCSection>

      <DCSection id="search-states" title="Search & empty states" subtitle="IMAP server-side search · empty-folder flourish">
        <DCArtboard id="search" label="Search results" width={W} height={H}>
          <ScreenSearch />
        </DCArtboard>
        <DCArtboard id="empty" label="Empty drafts · calligraphic flourish" width={W} height={H}>
          <ScreenEmpty />
        </DCArtboard>
      </DCSection>

      <DCSection id="settings" title="Settings" subtitle="Account, protocols, vault management">
        <DCArtboard id="settings" label="Account & protocols" width={W} height={H}>
          <ScreenSettings />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
